productApiFamily:
  segmentationAsDocumented: >-
    Reposit's own documents segment by two axes at once, which is unusual and
    worth recording faithfully. The Customer API segments by SUBJECT — auth,
    deployment, battery, solar, inverter — and the Market API segments by
    SUBJECT and simultaneously by AUDIENCE, declaring Network, Retailer and
    Installer as first-class tags applied alongside Node, Power Station, Data,
    Curtailment and Dispatch. An operation is therefore labelled both with what
    it does and with which class of organisation may call it.
  usageAndMetering: >-
    Present, household-scope only. House consumption, solar generation,
    battery-inverter real power, battery state of charge and grid-connection real
    power, all as time series with start/end/deltaT parameters. Fleet-scope
    equivalents exist on the Market API as downsampled, raw and latest telemetry.
  tariffsAndPricing: >-
    Absent as a product API. No plan, tariff or price endpoint exists on either
    contract. Reposit's commercial model is a savings guarantee, not a tariff
    catalogue, and the wholesale price signal it trades against is AEMO's, not
    its own to publish.
  billing: >-
    Represented only as GridCredits: /v2/deployments/{userkey}/gridcredits/historical
    returns earned credits in dollars. There is no invoice, statement or payment
    endpoint. The Customer API's schema list includes a CostHistorical schema
    that no path in the harvested document references.
  outages: >-
    No outage API. Node operational status and node events are the nearest
    equivalent and are partner-scope, on the Market API.
  derAndAssetControl: >-
    This is the centre of gravity of the Market API and the most consequential
    surface Reposit publishes. Export curtailment (constraints, create, list,
    cancel, get and change setpoint, heartbeat) and export dispatch (create,
    list, get) are write operations that act on real household hardware. Power
    Station CRUD lets a partner define and redefine the aggregations those
    commands target. The heartbeat endpoint implies a dead-man's-switch pattern
    on curtailment, which is a genuine grid-safety design choice made visible by
    the contract.
  chargingSessions: >-
    None. No EV charging surface, no OCPP, no OCPI.
  emissionsAndCarbon: >-
    None. No carbon intensity or emissions endpoint on either API.
  marketData: >-
    None published openly. Reposit participates in the National Electricity
    Market and in AEMO virtual power plant work, but exposes no market feed.

thirdPartyArtifacts:
  - artifact: https://github.com/RepositPower
    httpStatus: 200
    note: >-
      Reposit Power's GitHub organisation holds 23 repositories, of which 22 are
      forks of unrelated open-source infrastructure (OpenTSDB, repmgr, pyzmq,
      pfSense, Flask middleware). The single first-party repository is
      RepositPower/reposit-python-client, "A library to communicate with a
      Reposit Controller", Apache-2.0, 1 star, last pushed 2021-03-29. Its
      README.rst returns 404 on the master branch. It is not a client for either
      published HTTP API and is not treated as a maintained SDK here.
  - artifact: https://gist.github.com/6005505dd315594ce5c39eed98bcd82f
    httpStatus: 200
    note: >-
      "Reposit Market API - API Keys", a public gist created 2018-01-31 by GitHub
      user `switchtrue`, not by the RepositPower organisation. Its text is
      near-identical to the AccessToken description embedded in the official
      Market API spec, so it is treated as a mirror rather than as independent
      evidence. Recorded because search engines surface it above Reposit's own
      documentation.
  - artifact: https://gist.github.com/mleonard87/d5ed0a82760ceb75adc7df0d62bf9c31
    httpStatus: 404 via browser fetch, 200 via GitHub Gist API
    note: >-
      The Market API specification's info.description instructs callers to
      "review our versioning and support policy before using the API" and links
      to this gist. The link is broken for an ordinary reader: the gist is
      secret (public=false) and owned by `switchtrue`, not `mleonard87` as the
      URL implies, and not by the RepositPower organisation. Retrieved via the
      Gist API it proves to be "Reposit Market API Versioning Policy [DRAFT]",
      created 2017-09-18 and last updated 2017-10-03, still marked DRAFT nine
      years later. It defines a two-tier stability model — endpoints under /api
      are production with a 12-month deprecation window, endpoints without the
      /api prefix are prototype with no notice, no documentation and no support —
      and states that support is "provided as per the terms of the contract".
      Recorded as a governance finding: the only versioning commitment the API
      makes points at a nine-year-old draft that its intended audience cannot
      open.

companyContext:
  founded: 2012
  headquarters: Canberra, ACT, Australia
  homeMarket: Australia
  ceo: Dean Spaccavento (CEO and co-founder)
  positionInValueChain: >-
    Neither retailer nor network. Reposit sells a controller and a cloud platform
    through a national network of accredited solar installers, aggregates the
    resulting fleet of household batteries into a virtual power plant, and sells
    that flexibility to the retailers and network businesses who are the
    designated parties under the Consumer Data Right. Its consumer proposition is
    No Bill, a contractual guarantee of zero electricity bills for seven years or
    more, funded by GridCredits earned when the fleet supports the grid.
  scale: >-
    The company's own homepage states it serves more than 6,000 Australian homes
    and has operated for over a decade. Not independently verified.
  publicProgrammeHistory: >-
    Reposit received ARENA funding for an early Canberra virtual-power-plant
    trial aggregating roughly 250 rooftop systems to about 1MW, and
    Reposit-controlled batteries have appeared in retailer demand-response
    programmes. Recorded as background from secondary reporting, not as an API
    finding.

