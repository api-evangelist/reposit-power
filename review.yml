aid: reposit-power
name: Reposit Power
review:
  question: >-
    Australia extended the Consumer Data Right — the same statute, the same
    regulator (ACCC) and the same Data Standards Body that forced fifty banks to
    publish one byte-for-byte identical contract — from banking into energy. Does
    that transplanted mandate reach a distributed-energy aggregator like Reposit
    Power, and if not, what does the company publish anyway?
  answer: >-
    No, and quite a lot. The CDR energy designation lands on retailers, on
    distributors and on AEMO as gateway; it does not land on the DER aggregator
    sitting above them. Reposit is absent from the ACCC CDR Register's energy
    data-holder list and absent from the accredited-data-recipient list, and
    publishes no CDR page anywhere on its site. Yet with nothing compelling it,
    Reposit serves two real, complete, anonymously downloadable OpenAPI
    contracts — a Customer API and a Market API — behind two live Swagger UI
    pages. Both were harvested verbatim. Every operational endpoint on both
    returned 401 anonymously.
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: storage-flexibility
  summary: >-
    Reposit Power is the control case's control case. In the one sector where a
    proven statutory data mandate was deliberately transplanted, this company
    demonstrates the mandate's boundary: it operates entirely inside Australian
    energy, it holds half-hourly household metering, solar, battery and grid data
    for thousands of homes, and it can curtail and dispatch those homes' exports
    — and none of the Consumer Data Right applies to it, because the designation
    follows the retail relationship, not the data. What Reposit publishes it
    publishes voluntarily, and what it publishes is more machine-readable than
    most designated data holders manage: two OpenAPI documents totalling 39
    operations, served with content-disposition filenames and Last-Modified
    headers, no login required to read them.

mandate:
  regime: none
  regimeVerbatim: >-
    No obligation was found that applies to Reposit Power. The relevant regime in
    its home market is the Consumer Data Right (Competition and Consumer Act 2010
    Part IVD), extended by designation from banking into the energy sector,
    regulated by the ACCC with technical standards set by the Data Standards Body
    as the Consumer Data Standards, and with AEMO acting as the designated
    gateway for standardised retailer-held metering and service-point data. That
    designation attaches to energy retailers, to distribution network service
    providers and to AEMO. Reposit Power is none of those. It is a
    distributed-energy-resource aggregator and virtual power plant operator that
    sells a controller and a savings guarantee to households and sells fleet
    flexibility to the retailers and networks that ARE designated. The mandate
    therefore stops one layer below it.
  status: not-applicable
  statusReasoning: >-
    Recorded as not-applicable rather than none, and emphatically not as
    designated-not-live, because the distinction is the finding. Reposit is not
    a designated entity that has failed to build; it is an entity the
    designation was never drawn to include. Three checks establish this, all run
    anonymously on 2026-07-27 and all recorded under `evidence` below. (1) The
    public ACCC CDR Register energy data-holder brand summary returned HTTP 200
    with 84 energy brands and zero matches for the string "reposit" anywhere in
    the payload — the same register call that returns a working publicBaseUri for
    Amber, AGL, Origin and EnergyAustralia returns nothing for Reposit. (2) The
    CDR Register's all-data-recipients endpoint returned HTTP 200 on x-v: 3 with
    no match for "reposit", so Reposit is not an accredited data recipient
    either, meaning it cannot be a consumer of the mandated energy data any more
    than it is a producer of it. (3) Reposit's own site publishes no CDR surface
    at all: /cdr, /consumer-data-right and /data-sharing each returned 404, and
    the sitemap contains a single URL. No claim by the company was relied on for
    any part of this, because the company makes no claim.
  registerEvidence:
    - source: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
      method: GET
      headers: 'x-v: 1'
      httpStatus: 200
      fetched: '2026-07-27'
      brandsReturned: 84
      repositMatches: 0
      note: >-
        Same endpoint, same fetch date, that lists Amber, AGL, Origin Energy,
        EnergyAustralia, Alinta, Shell Energy, Red Energy and Powershop as energy
        data holders with populated public base URIs. Reposit Power appears
        nowhere in the response.
    - source: https://api.cdr.gov.au/cdr-register/v1/all/data-recipients
      method: GET
      headers: 'x-v: 3'
      httpStatus: 200
      fetched: '2026-07-27'
      repositMatches: 0
      note: >-
        x-v: 1 and x-v: 2 both returned HTTP 406 on this endpoint; x-v: 3
        returned 200 with a 173KB payload. No accredited data recipient named
        Reposit.
  siteEvidence:
    - probe: https://repositpower.com/cdr
      httpStatus: 404
    - probe: https://repositpower.com/consumer-data-right
      httpStatus: 404
    - probe: https://repositpower.com/data-sharing
      httpStatus: 404
    - probe: https://repositpower.com/integrations
      httpStatus: 404
    - probe: https://repositpower.com/sitemap.xml
      httpStatus: 200
      note: >-
        Returned a 94KB XML document containing exactly one <loc> entry
        (/data-centre-grid-services). No CDR, developer or data-sharing URL is
        advertised.
  interpretation: >-
    A mandate is not an implementation, and this profile records the inverse
    lesson just as sharply: an implementation is not a mandate. Reposit holds
    exactly the class of consumer energy data the Consumer Data Right was written
    to liberate — interval house consumption, solar generation, battery state of
    charge, grid-connection real power, all keyed to a National Meter Identifier —
    and it publishes documented APIs over that data. None of it is compelled.
    Had Reposit published nothing, no regulator would have noticed. The Australian
    energy CDR transplant therefore replicates the banking mandate's machinery
    faithfully at the retail layer while leaving the fastest-moving layer of the
    sector, the DER aggregators and VPP operators, entirely outside its perimeter.

dataStandard:
  primary: no standard reference found
  detail: >-
    Both harvested specifications were grepped on 2026-07-27 for every plausible
    sector standard. There is no reference to Green Button or ESPI, no reference
    to the Consumer Data Standards or /cds-au, no reference to IEEE 2030.5,
    CSIP-AUS or SEP2, no reference to OpenADR, no reference to OCPP or OCPI, and
    no reference to IEC CIM 61968/61970. The only sector vocabulary present is
    the Australian National Meter Identifier: the Market API's
    GET /api/nodes/{nodeId}/network returns an `nmi` field, and the term appears
    six times across the document. Both contracts are proprietary REST shapes.
  formats:
    - OpenAPI 3.0.3 (Reposit Customer API, version 2023.5.1)
    - OpenAPI 3.0.1 (Reposit Power Market API, version 1.0.0)
  note: >-
    Publishing an OpenAPI document is a description standard, not a data
    standard. Reposit describes its own proprietary model well; it does not
    implement anyone else's model.

consumerVsMarketSplit:
  consumerDataApi: true
  consumerDataDetail: >-
    Yes, but through the account holder, not through a consent framework. The
    Reposit Customer API exposes an individual household's own data —
    /v2/deployments/{userkey}/house/historical (consumption in kW),
    /generation/historical/p (solar generation as negative real power),
    /inverter/historical/p, /battery/historical/soc (state of charge in kWh),
    /battery/capacity, /meter/historical/p (real power at the grid connection)
    and /gridcredits/historical (earnings in dollars) — over a documented,
    versioned, publicly specified contract. A third party can reach that data
    only by holding the customer's own Reposit username and password and calling
    /v2/auth/login/ on their behalf. There is no OAuth authorisation code flow,
    no scope model, no consent dashboard and no accreditation: the delegation
    mechanism is credential sharing. That is materially weaker than the CDR
    consent model the same country mandates for retailers, and it is the price
    of falling outside the designation.
  marketDataOpen: false
  marketDataDetail: >-
    No. Reposit publishes no open grid, market or system data of any kind. There
    is no anonymous feed anywhere in either contract — unlike Amber Electric,
    whose spec carries an explicit `security: []` override on a public renewables
    endpoint, neither Reposit document declares a single unauthenticated
    operation. Verified on 2026-07-27: GET /api/nodes, GET /api/powerstations,
    GET /api/data, GET /api/curtailments, GET /api/dispatches and GET /api/users
    on marketapi.repositpower.com all returned HTTP 401 with body
    {"error":"unauthorized","message":"Unauthorized.","status":"error"}, and
    GET /v2/userkeys/ on api.repositpower.com returned the identical 401.
    Reposit's fleet telemetry is genuinely National Electricity Market-relevant
    aggregate data, and none of it is public.
  theSplit: >-
    The split here is not open-versus-closed data, it is open-versus-closed
    CONTRACT. Both API surfaces are fully documented and both are completely shut
    to an anonymous caller. What Reposit gives away for free is the machine-readable
    description of its platform; what it never gives away is a single row.

accessGate:
  gate: customer-account-required
  gateDetail: >-
    Recorded as customer-account-required because that is the gate on the API a
    developer would actually be pointed at, but the honest answer is that Reposit
    runs two different gates on two different APIs and neither is self-serve.
  perApi:
    - api: Reposit Customer API
      gate: customer-account-required
      whatADeveloperMustDo: >-
        Be, or hold the credentials of, an existing Reposit customer with an
        installed Reposit Controller. POST those credentials to
        https://api.repositpower.com/v2/auth/login/ with a Reposit-Auth header
        set to Stateless or API, receive a JWT access_token (plus a refresh_token
        under API auth), and send it as Authorization: Bearer <token>. There is
        no signup page, no free tier, no sandbox and no key-issuing console. A
        developer who does not own Reposit hardware cannot obtain a token by any
        published route.
      verified: >-
        POST /v2/auth/login/ with fabricated credentials returned HTTP 401 on
        2026-07-27; GET /v2/userkeys/ returned HTTP 401 anonymously.
    - api: Reposit Power Market API
      gate: partner-only
      whatADeveloperMustDo: >-
        Hold a Reposit Fleet account. The spec's own securityScheme description
        instructs the caller to log in to https://fleet.repositpower.com, open
        User Settings at https://fleet.repositpower.com/user/settings, use the
        "API Keys" section to "Add API Key", optionally whitelist origin IP
        addresses, confirm the account password, and copy the key once because
        Reposit does not store it. Fleet accounts are issued to network,
        retailer and installer organisations — the API's own tags are Network,
        Retailer, Installer and Customer — so the real prerequisite is a
        commercial relationship with Reposit. The Fleet login page is live
        (HTTP 200, Cloudflare Turnstile on the form) but offers no self-service
        registration. The versioning policy the spec links states support is
        "provided as per the terms of the contract", which confirms the
        contractual gate in Reposit's own words.
      verified: >-
        All six probed /api/* endpoints returned HTTP 401 anonymously on
        2026-07-27.
  whatIsUngated: >-
    The documentation and the contracts themselves. https://api.repositpower.com/docs/
    and https://marketapi.repositpower.com/docs/ both return HTTP 200 to an
    anonymous browser and render Swagger UI, and both specs download anonymously
    from https://api.repositpower.com/spec/ and
    https://marketapi.repositpower.com/docs/spec/ respectively. No login, no
    click-through, no licence agreement. That is a real and uncommon act of
    openness for a company under zero obligation to perform it.

authModel:
  customerApi:
    scheme: HTTP bearer, JWT
    declaredAs: 'components.securitySchemes.bearerAuth — type: http, scheme: bearer, bearerFormat: JWT'
    tokenAcquisition: >-
      POST /v2/auth/login/ with a JSON body of Reposit account credentials and a
      Reposit-Auth request header. Two modes are documented in the spec's own
      info.description: "Stateless authentication" issues a short-lived
      access_token with a stated expiry and requires full re-login afterwards;
      "API authentication" additionally issues a refresh_token redeemable at
      POST /v2/auth/refresh/.
    scopes: >-
      None. No scope, permission or consent model appears anywhere in the
      contract. A token is all-or-nothing over the deployments attached to the
      account.
  marketApi:
    scheme: API key presented as a bearer token
    declaredAs: 'components.securitySchemes.AccessToken — type: apiKey, in: header, name: Bearer'
    tokenAcquisition: >-
      Generated by hand inside the Reposit Fleet web application at
      /user/settings. Keys do not expire, may be restricted to a whitelist of
      origin IP addresses as a second factor, inherit the permissions of the
      Fleet user that created them, and are revocable from the same screen. The
      spec explicitly recommends creating a dedicated low-privilege Fleet account
      when a restricted key is needed, which is an admission that the key model
      has no scopes of its own.
    scopes: >-
      None declared. Authorisation is expressed as audience tags on operations
      (Network, Retailer, Installer, Customer, Management) rather than as OAuth
      scopes, and is enforced by the permissions of the underlying Fleet account.
  openidConnect:
    probed: https://repositpower.com/.well-known/openid-configuration
    httpStatus: 404
    alsoProbed: https://api.repositpower.com/.well-known/openid-configuration
    alsoProbedStatus: 404
    note: >-
      No OpenID Connect discovery document is served on any Reposit host. There
      is no OAuth2 authorisation server, no mTLS, and none of the CDR
      private_key_jwt machinery — consistent with the company being outside the
      Consumer Data Right entirely.

