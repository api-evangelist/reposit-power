  - url: https://api.repositpower.com/spec/
    type: OpenAPI
    httpStatus: 200
    note: OpenAPI 3.0.3, harvested verbatim to openapi/reposit-power-customer-api-openapi.yml
  - url: https://marketapi.repositpower.com/docs/
    type: APIReference
