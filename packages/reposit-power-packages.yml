summary: >-
  Reposit Power publishes exactly one first-party client library: the Python
  package `reposit` on PyPI, authored from a repositpower.com address and
  mirrored by the RepositPower GitHub organisation. It is a client for the
  household-scope Customer API surface (account login, userkeys, battery
  capacity, solar generation) and predates the OpenAPI 3.0.3 contract now served
  at https://api.repositpower.com/spec/ — it authenticates with a username and
  password rather than the documented /v2/auth/login/ bearer flow. It is
  recorded as official because Reposit Power authored and published it, and as
  unmaintained because the last release was 2019-01-24 and the last commit to
  its repository was 2021-03-29. There is no JavaScript, Java, .NET, Go, Ruby,
  PHP or Rust client, and no client of any language for the Market (Fleet) API,
  which is the surface that actually controls hardware.
