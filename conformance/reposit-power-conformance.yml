  openapi/reposit-power-market-api-openapi.yml,
  openapi/reposit-power-customer-api-openapi.yml, review.yml, live probes
  2026-07-27
summary: >-
  Reposit conforms to OpenAPI as a description standard and to nothing else. Both
  specifications were grepped for every plausible energy-sector standard and none
  is referenced: no Green Button or ESPI, no Consumer Data Standards or /cds-au
  base path, no IEEE 2030.5 / CSIP-AUS / SEP2, no OpenADR, no OCPP or OCPI, no
  IEC CIM 61968/61970, no Matter or EEBus. The single sector vocabulary present
  is the Australian National Metering Identifier (NMI), returned by
  GET /api/nodes/{nodeId}/network and accepted as the customer key on
  POST /api/capabilities. Reposit is not a designated Consumer Data Right energy
  data holder and is not an accredited data recipient — verified against the ACCC
  CDR Register on 2026-07-27 — so no CDR conformance is claimed or expected.
  Reposit publishes no compliance certifications (no SOC 2, ISO 27001, PCI DSS or
  equivalent page exists on any host), so no Compliance pointer is wired.
