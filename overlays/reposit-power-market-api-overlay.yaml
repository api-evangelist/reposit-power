- target: $.paths['/api/curtailments'].post
  update:
    x-agentic-access:
      action-class: acting
      consequence: safety-critical
      escalation:
        human-in-the-loop: required
    x-side-effect: >-
      Limits the real power export of every node in the target power station —
      real Australian households — for the requested duration.
    x-idempotency: >-
      Not supported. A retried POST creates a second curtailment; there is no
      request key and no documented deduplication.
- target: $.paths['/api/dispatches'].post
  update:
    x-agentic-access:
      action-class: acting
      consequence: safety-critical
      escalation:
        human-in-the-loop: required
    x-side-effect: >-
      Instructs every node in the target power station to deliver real power for
      the requested duration; powerFactor is honoured only where the account is
      enabled for power factor/voltage control.
    x-idempotency: >-
      Not supported. A retried POST creates a second dispatch.
- target: $.paths['/api/curtailments/setpoint'].post
  update:
    x-agentic-access:
      action-class: acting
      consequence: safety-critical
      escalation:
        human-in-the-loop: required
    x-side-effect: >-
      Changes the standing default curtailment behaviour of a power station. This
      persists until changed again, unlike a scheduled curtailment.
- target: $.paths['/api/curtailments/heartbeat'].post
  update:
    x-pattern: dead-mans-switch
    x-operational-note: >-
      Nodes receiving a heartbeat revert to their default curtailment behaviour
      if the heartbeat is lost. Callers holding a non-default setpoint must
      heartbeat continuously.
- target: $.paths['/api/powerstations/{powerstationId}/data'].get
  update:
    x-window-limit: >-
      format=nodes is limited to a 6 hour window; format=powerstation is limited
      to a 1 week window.
- target: $.paths['/api/curtailments'].get.parameters[0].schema
  update:
    x-spec-divergence: >-
      The parameter description documents a CANCELLED filter value that is absent
      from this enum. Reported as a contract defect, not corrected here.
- target: $.paths['/api/nodes/{nodeId}/events'].get
  update:
    x-summary-defect: >-
      The summary reads "Name Plate", duplicated from the preceding operation.
      The operation returns node events.
- target: $.components.securitySchemes.AccessToken
  update:
    x-declaration-divergence: >-
      Declared as type apiKey with in:header and name:Bearer, but the description
      instructs callers to send `Authorization: Bearer <key>`. The wire format is
      an RFC 6750-style bearer credential in the Authorization header; the
      declaration names the header "Bearer".
    x-key-properties:
      expires: false
      revocable: true
      ip_allowlist: optional
      scopes: none — inherits the full permissions of the issuing Fleet user
