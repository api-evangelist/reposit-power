summary: 'No official or third-party MCP server for Reposit Power exists. Searched the web, the MCP registry
  and Reposit''s own hosts on 2026-07-27; no mcp.* host resolves, no /.well-known/oauth-protected-resource
  is served, and no tools/list endpoint was found. This is a DERIVED candidate tool list mapped from the
  two published OpenAPI contracts — a design sketch for a future server, not a published one. It is deliberately
  split into a read tier and a control tier: eleven of the Market API operations command real power output
  on real Australian households, and any MCP exposure of them needs the escalation and human-in-the-loop
  contract captured in agentic-access/reposit-power-agentic-access.yml.'
