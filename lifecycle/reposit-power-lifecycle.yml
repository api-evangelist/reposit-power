summary: >-
  Reposit publishes a real, written versioning and deprecation policy — and then
  makes it almost impossible to read. The Market API specification's own
  info.description tells callers to "review our versioning and support policy
  before using the API" and links to a GitHub gist. That gist is secret rather
  than public, so the link 404s for an ordinary reader in a browser; retrieved
  through the Gist API it proves to be "Market API Versioning Policy [DRAFT]",
  created 2017-09-18, last updated 2017-10-03, still marked DRAFT nine years
  later, and owned by an individual account rather than by the RepositPower
  organisation. Its content is substantive: a two-tier stability model keyed to
  the URL path, a 12-month minimum deprecation window for production resources,
  a one-week notice period for emergency changes, and an explicit taxonomy of
  compatible, disruptive and emergency change. There is no status page, no SLA
  document, no changelog and no roadmap on any Reposit host.
versioning:
  customer_api:
    scheme: uri-path
    current: v2
    info_version: 2023.5.1
    docs: https://api.repositpower.com/docs/
    policy_published: false
  market_api:
    scheme: path-prefix stability tiers
    current: v1
    info_version: 1.0.0
    docs: https://marketapi.repositpower.com/docs/
    policy_url: https://gist.github.com/mleonard87/d5ed0a82760ceb75adc7df0d62bf9c31
    policy_reachable_in_browser: false
    policy_status: DRAFT
    policy_created: '2017-09-18'
    policy_updated: '2017-10-03'
    stability_tiers:
    - tier: production
      identified_by: endpoints carrying the /api URL path prefix
      guarantees:
      - Compatible changes may be made with no advance notice
      - Emergency changes may be made with 1 week's notice
      - >-
        Disruptive changes may not occur; instead a new major version is
        developed
      - >-
        Deprecated resources remain available for at least 12 months after
        deprecation, with notification
      - Documentation is provided
      - Support is provided as per the terms of the contract
    - tier: prototype-internal
      identified_by: endpoints without the /api URL path prefix
      guarantees:
      - Compatible, disruptive and emergency changes with no advance notice
      - May be deprecated or removed without notice
      - No documentation provided
      - No support provided
    change_taxonomy:
    - kind: compatible
      definition: >-
        Small in scope and unlikely to break or change semantics — adding
        endpoints, methods and attributes; documentation changes; changes to
        undocumented behaviour.
    - kind: disruptive
      definition: >-
        Changing the semantics of existing endpoints; removing endpoints,
        methods or attributes. Migration paths provided where needed.
    - kind: emergency
      definition: >-
        Unavoidable changes driven by legal compliance, security
        vulnerabilities or violation of specification.
